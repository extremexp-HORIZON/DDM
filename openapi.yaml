openapi: 3.0.1
info:
  title: Extreme XP Decentralized Data Management Swagger Documentation
  description: API for Extreme XP Decentralized Data Management and File Catalog
  version: "1.0"
servers:
- url: /
tags:
- name: file
  description: File-related operations
- name: files
  description: Multiple File-related operations
- name: file_metadata
  description: File-Metadata operations
- name: uploader_metadata
  description: File-Uploader Metadata operations
- name: catalog
  description: File catalog operations
- name: expectations
  description: Operations related to expectations
- name: validations
  description: Operations related to validations.
- name: parametrics
  description: Parametric Info
- name: user
  description: User-related operations
paths:
  /ddm/catalog/advanced:
    post:
      tags:
      - catalog
      summary: Supports complex JSON expressions for file filtering
      description: Supports complex JSON expressions for advanced file filtering.
      operationId: post_file_advanced_query_resource
      responses:
        "200":
          description: Files filtered successfully
          content: {}
        "400":
          description: Invalid JSON format
          content: {}
        "500":
          description: Internal server error
          content: {}
      security:
      - oauth2: []
  /ddm/catalog/list:
    get:
      tags:
      - catalog
      summary: Retrieve a paginated list of files with optional filters and sorting
      description: Retrieve a paginated list of files with optional filters and sorting.
      operationId: get_file_catalog_resource
      parameters:
      - name: filename
        in: query
        description: Filenames
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: use_case
        in: query
        description: Use Cases
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: project_id
        in: query
        description: Project IDs
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: created_from
        in: query
        description: Created date from (ISO 8601 format)
        schema:
          type: string
      - name: created_to
        in: query
        description: Created date to (ISO 8601 format)
        schema:
          type: string
      - name: user_id
        in: query
        description: User IDs
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: file_type
        in: query
        description: File Types
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: parent_files
        in: query
        description: Parent file IDs/names
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: size_from
        in: query
        description: Minimum file size in bytes
        schema:
          type: integer
      - name: size_to
        in: query
        description: Maximum file size in bytes
        schema:
          type: integer
      - name: sort
        in: query
        description: "Sort format: field,asc|desc"
        schema:
          type: string
          default: "id,asc"
      - name: page
        in: query
        description: Page number
        schema:
          type: integer
          default: 1
      - name: perPage
        in: query
        description: Results per page
        schema:
          type: integer
          default: 10
      responses:
        "200":
          description: Files retrieved successfully
          content: {}
        "400":
          description: Invalid request parameters
          content: {}
        "500":
          description: Internal server error
          content: {}
      security:
      - oauth2: []
  /ddm/catalog/my-catalog:
    get:
      tags:
      - catalog
      summary: Retrieve the catalog of files uploaded by the current user
      description: Retrieve the catalog of files uploaded by the current user.
      operationId: get_my_file_catalog_resource
      parameters:
      - name: filename
        in: query
        description: Filenames
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: use_case
        in: query
        description: Use Cases
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: project_id
        in: query
        description: Project IDs
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: created_from
        in: query
        description: Created date from (ISO 8601 format)
        schema:
          type: string
      - name: created_to
        in: query
        description: Created date to (ISO 8601 format)
        schema:
          type: string
      - name: user_id
        in: query
        description: User IDs
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: file_type
        in: query
        description: File Types
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: parent_files
        in: query
        description: Parent file IDs/names
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: size_from
        in: query
        description: Minimum file size in bytes
        schema:
          type: integer
      - name: size_to
        in: query
        description: Maximum file size in bytes
        schema:
          type: integer
      - name: sort
        in: query
        description: "Sort format: field,asc|desc"
        schema:
          type: string
          default: "id,asc"
      - name: page
        in: query
        description: Page number
        schema:
          type: integer
          default: 1
      - name: perPage
        in: query
        description: Results per page
        schema:
          type: integer
          default: 10
      responses:
        "200":
          description: User files retrieved successfully
          content: {}
        "400":
          description: Invalid request parameters
          content: {}
        "500":
          description: Internal server error
          content: {}
      security:
      - oauth2: []
  /ddm/catalog/options:
    get:
      tags:
      - catalog
      summary: "Retrieve file options based on project ID, filename, or user ID"
      description: "Retrieve file options based on project ID, filename, or user ID."
      operationId: get_file_options_resource
      parameters:
      - name: project_id
        in: query
        schema:
          type: string
      - name: name
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Options retrieved successfully
          content: {}
        "400":
          description: Invalid query parameters
          content: {}
        "500":
          description: Internal server error
          content: {}
      security:
      - oauth2: []
  /ddm/catalog/tree:
    get:
      tags:
      - catalog
      description: "Lazy-load tree data: paginated, filterable, sortable.."
      operationId: get_file_tree_resource
      parameters:
      - name: parent
        in: query
        description: Parent folder path
        schema:
          type: string
      - name: name
        in: query
        description: Filter by name
        schema:
          type: string
      - name: size
        in: query
        description: Filter by file size (bytes)
        schema:
          type: integer
      - name: type
        in: query
        description: Filter by type
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - name: perPage
        in: query
        description: Page size
        schema:
          type: integer
          default: 20
      - name: filter
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Files loaded successfully
          content: {}
        "400":
          description: Invalid JSON format
          content: {}
        "500":
          description: Internal server error
          content: {}
      security:
      - oauth2: []
  /ddm/expectations/suites:
    get:
      tags:
      - expectations
      summary: List all expectation suites with filters
      operationId: get_expectation_suite_list
      parameters:
      - name: suite_name
        in: query
        description: 'Suite names '
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: suite_id
        in: query
        description: 'Suite IDs '
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: file_types
        in: query
        description: 'File Types '
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: category
        in: query
        description: 'Categories '
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: use_case
        in: query
        description: 'Use cases '
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: user_id
        in: query
        description: 'User IDs '
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: created_from
        in: query
        description: Start datetime (ISO 8601)
        schema:
          type: string
      - name: created_to
        in: query
        description: End datetime (ISO 8601)
        schema:
          type: string
      - name: sort
        in: query
        description: "Sort: field,asc|desc"
        schema:
          type: string
          default: "created,desc"
      - name: page
        in: query
        description: Page number
        schema:
          type: integer
          default: 1
      - name: perPage
        in: query
        description: Results per page
        schema:
          type: integer
          default: 10
      responses:
        "200":
          description: Success
          content: {}
      security:
      - oauth2: []
    post:
      tags:
      - expectations
      summary: Post a new expectation suite
      operationId: post_expectation_suite_list
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectationSuite'
        required: true
      responses:
        "200":
          description: Success
          content: {}
      security:
      - oauth2: []
      x-codegen-request-body-name: payload
  /ddm/expectations/suites/{suite_id}:
    get:
      tags:
      - expectations
      summary: Get details of an expectation suite
      operationId: get_expectation_suite_detail
      parameters:
      - name: suite_id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Success
          content: {}
      security:
      - oauth2: []
  /ddm/expectations/upload-sample:
    post:
      tags:
      - expectations
      summary: Uploads a file and starts expectation + description tasks
      operationId: post_upload_sample
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUpload'
        required: true
      responses:
        "202":
          description: Accepted
          content: {}
      security:
      - oauth2: []
      x-codegen-request-body-name: payload
  /ddm/file/update/{file_id}:
    patch:
      tags:
      - file
      summary: "Update project_id, description, use_case, filename"
      description: "Update project_id, description, use_case, filename of a file."
      operationId: patch_file_resource
      parameters:
      - name: file_id
        in: path
        description: The ID of the file to update
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUpdate'
        required: true
      responses:
        "200":
          description: File updated successfully
          content: {}
        "400":
          description: No valid fields provided or NFT restriction
          content: {}
        "403":
          description: You are not authorized to update this file
          content: {}
        "404":
          description: File not found
          content: {}
        "500":
          description: Error updating file
          content: {}
      security:
      - oauth2: []
      x-codegen-request-body-name: payload
  /ddm/file/upload:
    post:
      tags:
      - file
      summary: "Upload a file with optional metadata and store in Zenoh, then start\
        \ metadata processing task"
      description: Upload a single file with optional JSON metadata file.
      operationId: post_single_file_upload_with_metadata_resource
      parameters:
      - name: project_id
        in: query
        description: Project ID is required for file organization.
        required: true
        schema:
          type: string
      - name: user_filename
        in: query
        description: File Name.
        schema:
          type: string
      - name: description
        in: query
        description: File Description.
        schema:
          type: string
      - name: use_case
        in: query
        description: Use cases (List).
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: string
                  description: A file is required for this upload.
                  format: binary
                metadata-file:
                  type: string
                  description: JSON metadata file for the file.
                  format: binary
        required: true
      responses:
        "200":
          description: File uploaded successfully
          content: {}
        "400":
          description: No file uploaded or invalid metadata or invalid project_id.
          content: {}
        "500":
          description: Failed to save file.
          content: {}
      security:
      - oauth2: []
  /ddm/file/upload-link:
    post:
      tags:
      - file
      summary: Retrieve file from URL and start Celery processing
      description: Retrieve a file from a given link and begin processing.
      operationId: post_upload_file_from_link
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadFileUrlRequest'
        required: true
      responses:
        "200":
          description: File retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadFileUrlResponse'
        "400":
          description: Invalid request (file_url and project_id are required)
          content: {}
        "500":
          description: Server error
          content: {}
      security:
      - oauth2: []
      x-codegen-request-body-name: payload
  /ddm/file/upload/async:
    post:
      tags:
      - file
      summary: Upload a file asynchronously in chunks and store directly in Zenoh
      description: Upload large file asynchronously in chunks and store each chunk
        directly in Zenoh.
      operationId: post_async_file_upload_resource
      parameters:
      - name: project_id
        in: query
        description: Project ID is required for file organization.
        required: true
        schema:
          type: string
      - name: user_filename
        in: query
        description: File Name.
        schema:
          type: string
      - name: description
        in: query
        description: File Description.
        schema:
          type: string
      - name: use_case
        in: query
        description: Use cases (List).
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: string
                  description: A file is required for this upload.
                  format: binary
                metadata-file:
                  type: string
                  description: JSON metadata file for the file.
                  format: binary
        required: true
      responses:
        "200":
          description: Chunk uploaded successfully
          content: {}
        "202":
          description: File upload completed and merging started!
          content: {}
        "400":
          description: No file uploaded or invalid metadata.
          content: {}
        "500":
          description: Failed to save file.
          content: {}
      security:
      - oauth2: []
  /ddm/file/{file_id}:
    get:
      tags:
      - file
      summary: Download a file
      description: Download a file by its ID
      operationId: get_file_download_resource
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: File downloaded successfully
          content: {}
        "404":
          description: File not found
          content: {}
      security:
      - oauth2: []
  /ddm/file/{file_id}/delete:
    delete:
      tags:
      - file
      summary: Soft delete a file and remove it from Zenoh if no metadata remains
      description: "Delete a file by its ID, including Zenoh storage and metadata\
        \ cleanup."
      operationId: delete_file_delete_resource
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: File deleted successfully
          content: {}
        "400":
          description: Cannot delete file due to NFT restriction
          content: {}
        "403":
          description: You are not authorized to delete this file
          content: {}
        "404":
          description: File not found
          content: {}
        "500":
          description: Failed to delete file
          content: {}
      security:
      - oauth2: []
  /ddm/file_metadata/:
    post:
      tags:
      - file_metadata
      summary: Retrieve metadata for multiple files by their IDs
      description: List of file IDs to retrieve metadata
      operationId: post_multiple_file_metadata_resource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileIdsRequest'
        required: true
      responses:
        "200":
          description: Success
          content: {}
      security:
      - oauth2: []
      x-codegen-request-body-name: payload
  /ddm/file_metadata/report/{file_id}:
    get:
      tags:
      - file_metadata
      summary: Retrieve the HTML profile report for a single file
      description: Retrieve the HTML profile report for a single file.
      operationId: get_single_file_report_resource
      parameters:
      - name: file_id
        in: path
        description: ID of the file to retrieve the report for
        required: true
        schema:
          type: string
      responses:
        "200":
          description: HTML report retrieved successfully
          content: {}
        "404":
          description: Report not found
          content: {}
        "500":
          description: Error retrieving the report
          content: {}
      security:
      - oauth2: []
  /ddm/file_metadata/reports:
    post:
      tags:
      - file_metadata
      summary: Retrieve HTML reports for multiple files from Zenoh
      description: List of file IDs to download reports
      operationId: post_file_reports_download_resource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileIdsRequest'
        required: true
      responses:
        "200":
          description: Success
          content: {}
      security:
      - oauth2: []
      x-codegen-request-body-name: payload
  /ddm/file_metadata/{file_id}:
    get:
      tags:
      - file_metadata
      summary: Retrieve a single file's metadata by ID
      description: Retrieve a file's metadata by file id
      operationId: get_file_metadata_resource
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
      responses:
        "404":
          description: File Not Found
          content: {}
        "200":
          description: Success
          content: {}
      security:
      - oauth2: []
  /ddm/files/delete:
    delete:
      tags:
      - files
      summary: Delete multiple files with Zenoh cleanup and metadata handling
      description: Delete multiple files by their IDs
      operationId: delete_multiple_file_delete_resource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteFileIds'
        required: true
      responses:
        "200":
          description: Files deleted successfully
          content: {}
        "404":
          description: One or more files not found
          content: {}
        "500":
          description: Failed to delete files
          content: {}
      security:
      - oauth2: []
      x-codegen-request-body-name: payload
  /ddm/files/download:
    post:
      tags:
      - files
      summary: Download multiple files as a ZIP archive (Fetched from Zenoh)
      description: Download multiple files by their IDs from Zenoh Storage
      operationId: post_multiple_file_download_resource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadFileIds'
        required: true
      responses:
        "200":
          description: Files downloaded successfully as a ZIP archive
          content: {}
        "400":
          description: No file IDs provided.
          content: {}
        "404":
          description: One or more files not found in Zenoh.
          content: {}
        "500":
          description: Failed to create ZIP file.
          content: {}
      security:
      - oauth2: []
      x-codegen-request-body-name: payload
  /ddm/files/download/project:
    post:
      tags:
      - files
      summary: Download all files under a given project path as a ZIP archive
      description: Download all files under a given project path from Zenoh Storage
      operationId: post_project_file_download_resource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectDownloadRequest'
        required: true
      responses:
        "200":
          description: Files downloaded successfully as a ZIP archive
          content: {}
        "400":
          description: Project ID not provided.
          content: {}
        "404":
          description: No files found under the specified project path.
          content: {}
        "500":
          description: Failed to create ZIP file.
          content: {}
      security:
      - oauth2: []
      x-codegen-request-body-name: payload
  /ddm/files/update:
    patch:
      tags:
      - files
      summary: Update multiple files
      description: "Update multiple files project_id, description, use_case, filename\
        \ at once"
      operationId: patch_multiple_files_update_resource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilesUpdateRequest'
        required: true
      responses:
        "200":
          description: Files updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesUpdateResponse'
        "400":
          description: Invalid request (Missing file list)
          content: {}
        "403":
          description: Unauthorized update attempt
          content: {}
        "404":
          description: One or more files not found
          content: {}
        "500":
          description: Server error
          content: {}
      security:
      - oauth2: []
      x-codegen-request-body-name: payload
  /ddm/files/upload:
    post:
      tags:
      - files
      summary: "Upload multiple files with metadata, store in Zenoh, and start processing\
        \ tasks"
      description: Upload many files withe their metadata.
      operationId: post_multiple_file_upload_resource
      parameters:
      - name: project_id
        in: query
        description: Project ID is required for organizing uploaded files.
        required: true
        schema:
          type: string
      - name: user_filenames
        in: query
        description: File Name.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: descriptions
        in: query
        description: File Description.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: use_case
        in: query
        description: List of use cases.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
              - files
              type: object
              properties:
                files:
                  type: array
                  description: The file(s) to upload.
                  items:
                    type: file
                    format: binary
                metadata-files:
                  type: array
                  description: Optional JSON metadata files for the uploaded files.
                  items:
                    type: file
                    format: binary
          multipart/form-data:
            schema:
              required:
              - files
              type: object
              properties:
                files:
                  type: array
                  description: The file(s) to upload.
                  items:
                    type: file
                    format: binary
                metadata-files:
                  type: array
                  description: Optional JSON metadata files for the uploaded files.
                  items:
                    type: file
                    format: binary
        required: true
      responses:
        "200":
          description: Success
          content: {}
      security:
      - oauth2: []
  /ddm/files/upload-links:
    post:
      tags:
      - files
      summary: Retrieve multiple files from URLs and start Celery processing
      description: Retrieve multiple files from given links and begin processing.
      operationId: post_upload_files_from_links
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadFileUrlsRequest'
        required: true
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadFileUrlsResponse'
        "200":
          description: Files retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadFileUrlsResponse'
        "400":
          description: Invalid request (files array and project_id are required)
          content: {}
        "500":
          description: Server error
