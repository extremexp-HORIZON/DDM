components:
  schemas:
    FileUpdate:
      required:
      - file_id
      type: object
      properties:
        file_id:
          type: string
          description: ID of the file to update
        project_id:
          type: string
          description: Updated project ID
        description:
          type: string
          description: Updated file description
        filename:
          type: string
          description: Updated filename
        use_case:
          type: array
          description: Updated use cases (List)
          items:
            type: string
    UploadFileUrlRequest:
      required:
      - file_url
      type: object
      properties:
        file_url:
          type: string
          description: URL of the file to retrieve
        description:
          type: string
          description: Short description of the file
        use_cases:
          type: array
          description: List of use cases
          items:
            type: string
        metadata:
          type: object
          properties: {}
          description: Additional metadata (JSON object)
    UploadFileUrlResponse:
      type: object
      properties:
        message:
          type: string
          description: Success message
        file_id:
          type: string
          description: ID of the uploaded file
        file_url:
          type: string
          description: URL of the uploaded file
        zenoh_file_path:
          type: string
          description: Storage path of the file
        fetch_task_id:
          type: string
          description: ID of the fetch task
        process_task_id:
          type: string
          description: ID of the processing task
    DownloadFileIds:
      required:
      - file_ids
      type: object
      properties:
        file_ids:
          type: array
          description: List of file IDs to download
          items:
            type: string
    ProjectDownloadRequest:
      required:
      - project_id
      type: object
      properties:
        project_id:
          type: string
          description: Project path like folder1/subfolder2
    FilesUpdateRequest:
      required:
      - files
      type: object
      properties:
        files:
          type: array
          description: List of files to update
          items:
            $ref: '#/components/schemas/FileUpdate'
    FilesUpdateResponse:
      type: object
      properties:
        message:
          type: string
          description: Update success message
        updated_files:
          type: array
          description: List of updated files
          items:
            $ref: '#/components/schemas/FileUpdate'
    DeleteFileIds:
      required:
      - file_ids
      type: object
      properties:
        file_ids:
          type: array
          description: List of file IDs to delete
          items:
            type: string
    UploadFileUrlsRequest:
      required:
      - files
      - project_id
      type: object
      properties:
        project_id:
          type: string
          description: Project ID associated with the files
        files:
          type: array
          description: List of files to upload
          items:
            $ref: '#/components/schemas/UploadFileUrlRequest'
    UploadFileUrlsResponse:
      type: object
      properties:
        message:
          type: string
          description: Files uploaded successfully
        files:
          type: array
          description: List of uploaded file responses
          items:
            $ref: '#/components/schemas/UploadFileUrlResponse'
    FileIdsRequest:
      required:
      - file_ids
      type: object
      properties:
        file_ids:
          type: array
          description: List of file IDs to download reports
          items:
            type: string
    UploaderMetadataJSON:
      type: object
      properties:
        uploader_metadata:
          type: object
          properties: {}
          description: Uploader metadata (JSON)
    FileUpload:
      required:
      - file
      type: object
      properties:
        file:
          type: object
          properties: {}
          description: Upload a sample file
        datasource_name:
          type: string
          description: Datasource name
    ExpectationSuite:
      required:
      - expectations
      - file_types
      - suite_name
      - user_id
      type: object
      properties:
        suite_name:
          type: string
        file_types:
          type: array
          description: Allowed file types
          items:
            type: string
        expectations:
          type: object
          properties: {}
        category:
          type: string
        description:
          type: string
        user_id:
          type: string
        use_case:
          type: string
    ValidationResult:
      required:
      - dataset_name
      - suite_id
      - user_id
      type: object
      properties:
        user_id:
          type: string
        suite_id:
          type: string
        suite_name:
          type: string
        dataset_name:
          type: string
        result_summary:
          type: object
          properties: {}
        detailed_results:
          type: object
          properties: {}
        path:
          type: string
          description: Results file path
    ValidateFilesAgainstSuite:
      required:
      - file_ids
      - suite_id
      type: object
      properties:
        suite_id:
          type: string
          description: Expectation suite ID
        file_ids:
          type: array
          description: List of file IDs to validate
          items:
            type: string
    ValidateFileAgainstSuites:
      required:
      - file_id
      - suite_ids
      type: object
      properties:
        file_id:
          type: string
          description: ID of the file to validate
        suite_ids:
          type: array
          description: List of suite IDs to validate against
          items:
            type: string
    UserProfileUpdate:
      type: object
      properties:
        public_key:
          type: string
          description: Ethereum Public Key
  responses:
    ParseError:
      description: When a mask can't be parsed
      content: {}
    MaskError:
      description: When any error occurs on mask
      content: {}
